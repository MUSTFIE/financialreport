<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>電子支付優惠券管家</title>
  
  <!-- Web App iOS Setup -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="消費券管家">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* iOS Custom Aesthetics */
    -webkit-tap-highlight-color: transparent;
    
    body {
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    /* Animation */
    .coupon-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .coupon-card:active {
      transform: scale(0.92);
      opacity: 0.8;
    }

    .coupon-exit {
      transform: scale(0) rotate(-10deg);
      opacity: 0;
      max-width: 0;
      padding: 0;
      margin: 0;
    }

    /* Dragging Styles */
    .platform-card.dragging {
      opacity: 0.4;
      transform: scale(0.98);
    }

    /* Safe Area Padding */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1rem);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 1rem);
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col selection:bg-none">

  <!-- Header Section -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md text-white pt-safe px-4 pb-3 shadow-md border-b border-slate-800">
    <div class="max-w-md mx-auto flex items-center justify-between mt-1">
      <div>
        <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
          <i data-lucide="ticket" class="w-6 h-6 text-amber-400"></i>
          優惠券管家
        </h1>
        <p class="text-xs text-slate-400 mt-0.5" id="resetCountdown">每週五 00:00 自動清空</p>
      </div>

      <button onclick="openAddPlatformModal()" class="flex items-center gap-1.5 bg-amber-500 active:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-full text-xs font-semibold shadow-sm transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>新增平台</span>
      </button>
    </div>

    <!-- Overall Summary Banner -->
    <div class="max-w-md mx-auto mt-3 bg-slate-800/80 rounded-xl p-3 border border-slate-700/60 grid grid-cols-3 gap-2 text-center">
      <div>
        <p class="text-[10px] text-slate-400 uppercase tracking-wider">總券數量</p>
        <p class="text-base font-bold text-amber-400 mt-0.5" id="totalCount">0 <span class="text-xs font-normal text-slate-400">張</span></p>
      </div>
      <div class="border-x border-slate-700/80">
        <p class="text-[10px] text-slate-400 uppercase tracking-wider">總券面額</p>
        <p class="text-base font-bold text-emerald-400 mt-0.5" id="totalAmount">$0</p>
      </div>
      <div>
        <p class="text-[10px] text-amber-300/80 font-medium tracking-wider">最少需消費 (3X)</p>
        <p class="text-base font-bold text-amber-300 mt-0.5" id="totalRequired">$0</p>
      </div>
    </div>
  </header>

  <!-- Main Scrollable Area -->
  <main class="flex-1 overflow-y-auto px-4 py-4 max-w-md mx-auto w-full space-y-4 pb-12" id="platformContainer">
    <!-- Platform Cards generated dynamically -->
  </main>

  <!-- Floating Footer Actions -->
  <footer class="fixed bottom-0 left-0 right-0 z-20 bg-slate-900/80 backdrop-blur-md border-t border-slate-800 py-2.5 px-4 pb-safe">
    <div class="max-w-md mx-auto flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-1">
        <i data-lucide="info" class="w-3.5 h-3.5 text-slate-400"></i>
        <span>點擊券標籤即可直接使用消去</span>
      </div>
      <button onclick="confirmResetAll()" class="text-rose-400 hover:text-rose-300 active:opacity-75 flex items-center gap-1">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        手動重置
      </button>
    </div>
  </footer>

  <!-- Modal: Add New Platform -->
  <div id="addPlatformModal" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl border border-slate-100 transform transition-all">
      <h3 class="text-lg font-bold text-slate-900 mb-1">新增電子支付方式</h3>
      <p class="text-xs text-slate-500 mb-4">輸入您想要新增的電子錢包或銀行支付名稱</p>
      
      <input type="text" id="newPlatformName" placeholder="例如：廣發銀行、Tai Fung Pay..." 
        class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 mb-4">
      
      <div class="flex items-center justify-end gap-2">
        <button onclick="closeAddPlatformModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 bg-slate-100 active:bg-slate-200">
          取消
        </button>
        <button onclick="addNewPlatform()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-950 bg-amber-400 active:bg-amber-500">
          確認新增
        </button>
      </div>
    </div>
  </div>

  <script>
    // Initial Default Platforms
    const DEFAULT_PLATFORMS = [
      { id: 'mpay', name: 'MPay 澳門錢包', color: 'from-red-500 to-rose-600', icon: 'wallet' },
      { id: 'icbc', name: 'ICBC 工銀 e 支付', color: 'from-red-600 to-red-800', icon: 'credit-card' },
      { id: 'boc', name: '中銀智慧付', color: 'from-rose-700 to-red-900', icon: 'landmark' },
      { id: 'uepay', name: 'UePay 澳門極易付', color: 'from-sky-500 to-blue-600', icon: 'smartphone' }
    ];

    const DENOMINATIONS = [10, 20, 50, 100, 200];
    const MAX_COUPONS_PER_PLATFORM = 3;

    // State
    let platforms = JSON.parse(localStorage.getItem('m_platforms')) || DEFAULT_PLATFORMS;
    let coupons = JSON.parse(localStorage.getItem('m_coupons')) || {};
    let lastResetTimestamp = localStorage.getItem('m_lastReset') || null;

    // DOM Elements
    const platformContainer = document.getElementById('platformContainer');

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      checkWeeklyReset();
      renderApp();
      setupTouchDragAndDrop();
    });

    // Check if Friday 00:00 has passed since last reset
    function checkWeeklyReset() {
      const now = new Date();
      const lastFriday = getLastFridayTimestamp(now);

      if (!lastResetTimestamp || parseInt(lastResetTimestamp) < lastFriday) {
        // Perform Auto Reset
        coupons = {};
        localStorage.setItem('m_coupons', JSON.stringify(coupons));
        localStorage.setItem('m_lastReset', now.getTime().toString());
        lastResetTimestamp = now.getTime().toString();
      }
    }

    // Helper: Calculate previous Friday 00:00:00 timestamp
    function getLastFridayTimestamp(fromDate) {
      const d = new Date(fromDate);
      const day = d.getDay();
      const diffToFriday = (day >= 5) ? (day - 5) : (day + 2);
      
      d.setDate(d.getDate() - diffToFriday);
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }

    // Save State
    function saveData() {
      localStorage.setItem('m_platforms', JSON.stringify(platforms));
      localStorage.setItem('m_coupons', JSON.stringify(coupons));
      renderApp();
    }

    // Render Main Application UI
    function renderApp() {
      platformContainer.innerHTML = '';

      let grandTotalCount = 0;
      let grandTotalAmount = 0;

      platforms.forEach((platform) => {
        const platformCoupons = coupons[platform.id] || [];
        const isFull = platformCoupons.length >= MAX_COUPONS_PER_PLATFORM;
        
        const platformTotal = platformCoupons.reduce((sum, val) => sum + val, 0);
        const platformRequired = platformTotal * 3;

        grandTotalCount += platformCoupons.length;
        grandTotalAmount += platformTotal;

        // Platform Card Wrapper
        const card = document.createElement('div');
        card.className = 'platform-card bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden relative transition-all duration-200';
        card.dataset.id = platform.id;

        // Header
        const colorGradient = platform.color || 'from-slate-700 to-slate-900';
        card.innerHTML = `
          <div class="bg-gradient-to-r ${colorGradient} text-white px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <i data-lucide="${platform.icon || 'wallet'}" class="w-5 h-5 text-white/90"></i>
              <h2 class="font-bold text-sm tracking-wide">${platform.name}</h2>
            </div>
            
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${isFull ? 'bg-amber-400 text-slate-950' : 'bg-black/20 text-white/90'}">
                ${platformCoupons.length}/${MAX_COUPONS_PER_PLATFORM} ${isFull ? '已滿' : ''}
              </span>
              <!-- Delete Platform Button -->
              <button onclick="removePlatform('${platform.id}')" class="text-white/60 hover:text-white p-1 rounded-lg active:bg-white/10 transition" title="刪除平台">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
              <!-- Drag Handle -->
              <div class="drag-handle cursor-grab active:cursor-grabbing p-1 text-white/60 hover:text-white rounded-lg">
                <i data-lucide="grip-vertical" class="w-4 h-4"></i>
              </div>
            </div>
          </div>

          <div class="p-3.5 space-y-3">
            <!-- Add Coupon Buttons -->
            <div>
              <p class="text-[10px] font-medium text-slate-400 mb-1.5 flex items-center justify-between">
                <span>新增優惠券面額：</span>
                ${isFull ? '<span class="text-rose-500 font-semibold">已達上限 (最多3張)</span>' : ''}
              </p>
              <div class="grid grid-cols-5 gap-1.5">
                ${DENOMINATIONS.map(amount => `
                  <button 
                    onclick="addCoupon('${platform.id}', ${amount})" 
                    ${isFull ? 'disabled' : ''}
                    class="py-1.5 rounded-lg text-xs font-bold border transition-all duration-150 ${
                      isFull 
                        ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' 
                        : 'bg-slate-50 text-slate-700 border-slate-200 active:bg-amber-400 active:text-slate-950 active:border-amber-400 active:scale-95'
                    }"
                  >
                    +$${amount}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Coupons Display Grid (3 Columns) -->
            <div class="pt-1">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">持有優惠券</span>
                <span class="text-xs text-slate-500">
                  小計: <strong class="text-emerald-600 font-bold">$${platformTotal}</strong> 
                  (滿 <strong class="text-amber-600 font-bold">$${platformRequired}</strong> 可用)
                </span>
              </div>

              ${platformCoupons.length === 0 ? `
                <div class="py-4 text-center border-2 border-dashed border-slate-100 rounded-xl">
                  <p class="text-xs text-slate-300">暫無優惠券，點擊上方按鈕新增</p>
                </div>
              ` : `
                <div class="grid grid-cols-3 gap-2">
                  ${platformCoupons.map((amount, index) => `
                    <div 
                      onclick="useCoupon('${platform.id}', ${index}, this)"
                      class="coupon-card bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200/90 rounded-xl p-2 text-center cursor-pointer relative overflow-hidden shadow-sm flex flex-col justify-center items-center h-16"
                    >
                      <span class="text-lg font-black text-amber-600 leading-none">$${amount}</span>
                      <span class="text-[10px] font-semibold text-amber-800/70 bg-amber-200/60 px-1.5 py-0.5 rounded-full mt-1">
                        滿 $${amount * 3}
                      </span>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        `;

        platformContainer.appendChild(card);
      });

      // Update Summary Header
      document.getElementById('totalCount').innerHTML = `${grandTotalCount} <span class="text-xs font-normal text-slate-400">張</span>`;
      document.getElementById('totalAmount').innerText = `$${grandTotalAmount}`;
      document.getElementById('totalRequired').innerText = `$${grandTotalAmount * 3}`;

      lucide.createIcons();
    }

    // Add Coupon
    function addCoupon(platformId, amount) {
      if (!coupons[platformId]) coupons[platformId] = [];
      
      if (coupons[platformId].length >= MAX_COUPONS_PER_PLATFORM) {
        alert('每個支付方式最多只能選擇 3 張優惠券！');
        return;
      }

      coupons[platformId].push(amount);
      saveData();
    }

    // Use / Delete Coupon
    function useCoupon(platformId, index, el) {
      el.classList.add('coupon-exit');
      setTimeout(() => {
        if (coupons[platformId]) {
          coupons[platformId].splice(index, 1);
          saveData();
        }
      }, 200);
    }

    // Add Platform Modal
    function openAddPlatformModal() {
      document.getElementById('addPlatformModal').classList.remove('hidden');
      document.getElementById('newPlatformName').focus();
    }

    function closeAddPlatformModal() {
      document.getElementById('addPlatformModal').classList.add('hidden');
      document.getElementById('newPlatformName').value = '';
    }

    function addNewPlatform() {
      const input = document.getElementById('newPlatformName');
      const name = input.value.trim();
      if (!name) return;

      const colors = [
        'from-emerald-600 to-teal-800',
        'from-purple-600 to-indigo-800',
        'from-amber-500 to-orange-700',
        'from-cyan-600 to-blue-800',
        'from-fuchsia-600 to-pink-800'
      ];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];

      const newPlatform = {
        id: 'p_' + Date.now(),
        name: name,
        color: randomColor,
        icon: 'credit-card'
      };

      platforms.push(newPlatform);
      closeAddPlatformModal();
      saveData();
      setupTouchDragAndDrop();
    }

    // Remove Platform
    function removePlatform(platformId) {
      const p = platforms.find(item => item.id === platformId);
      if (confirm(`確定要刪除「${p ? p.name : '此平台'}」嗎？該平台下的所有優惠券也將被清除。`)) {
        platforms = platforms.filter(item => item.id !== platformId);
        delete coupons[platformId];
        saveData();
        setupTouchDragAndDrop();
      }
    }

    // Manual Reset All
    function confirmResetAll() {
      if (confirm('確定要清空所有已選擇的優惠券嗎？')) {
        coupons = {};
        saveData();
      }
    }

    // Touch Drag and Drop Implementation
    function setupTouchDragAndDrop() {
      let draggedEl = null;
      let touchStartY = 0;

      const cards = document.querySelectorAll('.platform-card');

      cards.forEach(card => {
        const handle = card.querySelector('.drag-handle');
        if (!handle) return;

        handle.addEventListener('touchstart', (e) => {
          draggedEl = card;
          card.classList.add('dragging');
          touchStartY = e.touches[0].clientY;
        }, { passive: true });

        handle.addEventListener('touchmove', (e) => {
          if (!draggedEl) return;
          const currentY = e.touches[0].clientY;
          const targetEl = document.elementFromPoint(e.touches[0].clientX, currentY);
          
          if (targetEl) {
            const targetCard = targetEl.closest('.platform-card');
            if (targetCard && targetCard !== draggedEl) {
              const rect = targetCard.getBoundingClientRect();
              const next = (currentY - rect.top) > (rect.height / 2);
              platformContainer.insertBefore(draggedEl, next ? targetCard.nextSibling : targetCard);
            }
          }
        }, { passive: true });

        handle.addEventListener('touchend', () => {
          if (!draggedEl) return;
          draggedEl.classList.remove('dragging');
          draggedEl = null;

          // Update Platforms Order Array
          const newOrder = [];
          document.querySelectorAll('.platform-card').forEach(c => {
            const id = c.dataset.id;
            const p = platforms.find(item => item.id === id);
            if (p) newOrder.push(p);
          });
          platforms = newOrder;
          localStorage.setItem('m_platforms', JSON.stringify(platforms));
        });
      });
    }
  </script>
</body>
</html>
